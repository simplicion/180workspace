version: '3.8'

services:
  # 1. Meilisearch (Search Engine)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: 180workspace-meilisearch
    environment:
      - MEILI_MASTER_KEY=your_master_key_here
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped

  # 2. 180workspace Main API + WebSocket Backend
  backend:
    image: ghcr.io/${GITHUB_ACTOR:-yourusername}/pitchin180-platform-backend:latest
    container_name: backend
    ports:
      - "4002:4002"
    restart: unless-stopped
    # env_file:
    #   - ./apps/backend/.env

  # 3. 180workspace Dedicated Background Worker
  worker:
    image: ghcr.io/${GITHUB_ACTOR:-yourusername}/pitchin180-platform-worker:latest
    container_name: worker
    restart: unless-stopped
    # env_file:
    #   - ./apps/worker/.env

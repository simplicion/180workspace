[workspace]
members = [
    "crates/engine-core",
    "crates/engine-timeline",
    "crates/engine-media",
    "crates/engine-render",
    "crates/engine-gpu",
    "crates/engine-tracking",
    "crates/engine-telemetry",
    "crates/engine-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["180 Workspace Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"

services:

  # 1. Reverse Proxy (Nginx with Cloudflare Real-IP)
  reverse-proxy:
    image: nginx:alpine
    container_name: 180workspace-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin-web
      - backend
    networks:
      - 180workspace-net

  # 2. SaaS Platform Frontend (Next.js 15 Standalone)
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}-frontend:latest
    container_name: 180workspace-frontend
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - 180workspace-net

  # 3. Admin Web Platform (Next.js 15 Standalone)
  admin-web:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}-admin-web:latest
    container_name: 180workspace-admin-web
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - 180workspace-net

  # 4. Express Enterprise Backend
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}:latest
    container_name: 180workspace-backend
    restart: always
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - 180workspace-net

  # 5. BullMQ & Background Worker
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}:latest
    container_name: 180workspace-worker
    restart: always
    command: ["tsx", "server.js"]
    environment:
      - RUN_MODE=worker
      - PORT=4003
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - 180workspace-net

networks:
  180workspace-net:
    driver: bridge

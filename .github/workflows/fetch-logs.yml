name: Fetch PM2 Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    name: Fetch PM2 Logs
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            echo "=== DOCKER CONTAINERS ==="
            docker ps -a
            echo "=== BACKEND LOGS ==="
            docker compose logs --tail 150 backend 2>/dev/null || docker logs $(docker ps -qf "name=backend") --tail 150 2>/dev/null || true
            echo "=== FRONTEND LOGS ==="
            docker compose logs --tail 150 frontend 2>/dev/null || docker logs $(docker ps -qf "name=frontend") --tail 150 2>/dev/null || true
            echo "=== SYSTEM / NGINX / DOCKER LOGS ==="
            docker compose logs --tail 50 2>/dev/null || true



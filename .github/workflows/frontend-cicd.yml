name: Frontend CICD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/180workspace-frontend/**'
      - 'apps/180workspace-admin-web/**'
      - 'apps/pitchin180-frontend/**'
      - 'apps/pitchin180-admin-web/**'
      - '.github/workflows/frontend-cicd.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: 180workspace-frontend
            context: .
            dockerfile: apps/180workspace-frontend/Dockerfile
            image-suffix: 180workspace-frontend
          - app: 180workspace-admin-web
            context: .
            dockerfile: apps/180workspace-admin-web/Dockerfile
            image-suffix: 180workspace-admin-web
          - app: pitchin180-frontend
            context: .
            dockerfile: apps/pitchin180-frontend/Dockerfile
            image-suffix: pitchin180-frontend
          - app: pitchin180-admin-web
            context: .
            dockerfile: apps/pitchin180-admin-web/Dockerfile
            image-suffix: pitchin180-admin-web

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image-suffix }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Master CI/CD Pipeline

on:
  push:
    branches: [ "Production", "main", "Testing-updates" ]

jobs:
  # ==========================================
  # Phase 1: Build & Push Docker Image
  # ==========================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository name (lowercase)
        id: repo-name
        run: |
          REPO=${{ github.repository }}
          echo "REPO_LOWER=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.REPO_LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Phase 2: Deploy Backend to AWS EC2
  # ==========================================
  deploy-backend:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Extract repository name (lowercase)
        id: repo-name
        run: |
          REPO=${{ github.repository }}
          echo "REPO_LOWER=${REPO,,}" >> $GITHUB_OUTPUT
          
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LOWER: ${{ steps.repo-name.outputs.REPO_LOWER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,REPO_LOWER
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/app
            
            # Update codebase to get latest docker-compose.yml
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote rm origin || true
            git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Login to GHCR to pull the image
            echo $GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Export GITHUB_REPOSITORY_LOWER so docker-compose can use it
            export GITHUB_REPOSITORY_LOWER=$REPO_LOWER
            
            # Pull the latest image
            docker compose pull || docker-compose pull
            
            # Start the new container (recreates automatically, zero downtime style if configured properly)
            docker compose up -d || docker-compose up -d
            
            # Stop pm2 if it's still running (Migration step)
            pm2 stop all || true
            pm2 delete all || true
            pm2 save || true
            
            # Clean up old docker images
            docker image prune -af

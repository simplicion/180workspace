name: Master CI/CD Pipeline

on:
  push:
    branches: [ "Production", "main", "Testing-updates" ]

jobs:
  # ==========================================
  # Phase 1: Preparation
  # ==========================================
  prepare:
    name: Prepare & Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup pnpm cache
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ==========================================
  # Phase 2: Build Backend
  # ==========================================
  build-backend:
    name: Build Backend Services
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Database & Packages
        run: pnpm turbo run build --filter=backend --filter=worker

  # ==========================================
  # Phase 3: Deploy Backend to AWS EC2
  # ==========================================
  deploy-backend:
    name: Deploy to AWS EC2
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            cd /home/ubuntu/app
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote rm origin || true
            git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            pnpm install --frozen-lockfile
            pnpm turbo run build --filter=backend --filter=worker
            pm2 restart all --update-env
            pm2 save


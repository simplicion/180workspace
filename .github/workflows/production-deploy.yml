name: Master CI/CD Pipeline

on:
  push:
    branches: [ "Production" ]

jobs:
  # ==========================================
  # Phase 1: Preparation
  # ==========================================
  prepare:
    name: Prepare & Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup pnpm cache
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ==========================================
  # Phase 2: Build Backend
  # ==========================================
  build-backend:
    name: Build Backend Services
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Database & Packages
        run: pnpm turbo run build --filter=backend --filter=worker

  # ==========================================
  # Phase 3: Deploy Backend to AWS EC2
  # ==========================================
  deploy-backend:
    name: Deploy to AWS EC2
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            git fetch origin Production
            git reset --hard origin/Production
            pnpm install --frozen-lockfile
            pnpm turbo run build --filter=backend --filter=worker
            pm2 restart all --update-env
            pm2 save

  # ==========================================
  # Phase 4: Deploy Frontend to Cloudflare
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Workers
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build with OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          BUILD_STANDALONE: "true"
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://44.214.118.213' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL || 'http://44.214.118.213' }}
          NEXT_PUBLIC_MAIN_DOMAIN: ${{ vars.NEXT_PUBLIC_MAIN_DOMAIN || 'pitchin180.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '105622126018-dsr81g6gokec4cnepdidmci3dotch697.apps.googleusercontent.com' }}
          NEXT_PUBLIC_RAZORPAY_KEY: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY || 'rzp_live_TJ4cJdMCagilvq' }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://workspace.pitchin180.com' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '105622126018-dsr81g6gokec4cnepdidmci3dotch697.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

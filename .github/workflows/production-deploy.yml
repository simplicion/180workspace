name: Master Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ====================================================
  # Phase 1: Deploy Marketing Web to Cloudflare Pages
  # ====================================================
  deploy-marketing-cloudflare:
    name: Deploy Marketing Site to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Marketing Site
        run: pnpm turbo run build --filter=apps-marketing-web...

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/marketing-web/dist --project-name=180workspace-marketing --branch=main --commit-dirty=true

  # ====================================================
  # Phase 2: Build & Push Docker Images (GHCR)
  # ====================================================
  build-and-push-images:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: ./Dockerfile
            suffix: ""
          - name: frontend
            file: ./apps/frontend/Dockerfile
            suffix: "-frontend"
          - name: admin-web
            file: ./apps/admin-web/Dockerfile
            suffix: "-admin-web"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repository name (lowercase)
        id: repo-name
        run: |
          REPO=${{ github.repository }}
          echo "REPO_LOWER=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.REPO_LOWER }}${{ matrix.suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================
  # Phase 3: Zero-Downtime Deploy to AWS EC2
  # ====================================================
  deploy-aws:
    name: Deploy All Containers to AWS EC2
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Extract repository name (lowercase)
        id: repo-name
        run: |
          REPO=${{ github.repository }}
          echo "REPO_LOWER=${REPO,,}" >> $GITHUB_OUTPUT

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LOWER: ${{ steps.repo-name.outputs.REPO_LOWER }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,REPO_LOWER,PRODUCTION_ENV_FILE,NEXTAUTH_SECRET,META_WEBHOOK_VERIFY_TOKEN
          command_timeout: 30m
          script: |
            set -e

            # 1. Expand root partition and filesystem to full 30GB EBS volume
            echo "==> Expanding disk partition & filesystem..."
            sudo growpart /dev/sda 1 2>/dev/null || sudo growpart /dev/xvda 1 2>/dev/null || sudo growpart /dev/nvme0n1 1 2>/dev/null || true
            sudo resize2fs /dev/sda1 2>/dev/null || sudo resize2fs /dev/xvda1 2>/dev/null || sudo resize2fs /dev/nvme0n1p1 2>/dev/null || sudo xfs_growfs -d / 2>/dev/null || true

            # 2. Aggressive Disk Space Recovery before pulling new layers
            echo "==> Reclaiming disk space..."
            sudo apt-get clean 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            sudo rm -rf /var/lib/docker/tmp/* /tmp/* 2>/dev/null || true

            echo "==> Available Disk Space:"
            df -h /

            cd /home/ubuntu/app

            # 3. Configure 4GB Virtual Swap File if not already configured
            if [ ! -f /swapfile ]; then
              echo "==> Provisioning 4GB Virtual Swap Memory on SSD..."
              sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "==> 4GB Swap file active."
            fi

            # 4. Inject production environment variables
            echo "$PRODUCTION_ENV_FILE" > .env

            # 4b. NEXTAUTH_SECRET must be defined at runtime. The application no longer contains a fallback default
            #     (a publicly known default let anyone forge a session). If the env blob does not define it, take it
            #     from the dedicated repository secret; the last definition in .env wins.
            if ! grep -q '^NEXTAUTH_SECRET=.\+' .env; then
              if [ -n "$NEXTAUTH_SECRET" ]; then
                printf '\nNEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET" >> .env
                echo "==> NEXTAUTH_SECRET injected from repository secret."
              else
                echo "!! WARNING: NEXTAUTH_SECRET is not defined in PRODUCTION_ENV_FILE or repository secrets. NextAuth (Google) sign-in will be unavailable."
              fi
            fi

            # 4c. META_WEBHOOK_VERIFY_TOKEN — injected from dedicated repository secret if not already
            #     present in PRODUCTION_ENV_FILE. Same pattern as NEXTAUTH_SECRET above.
            if ! grep -q '^META_WEBHOOK_VERIFY_TOKEN=.\+' .env; then
              if [ -n "$META_WEBHOOK_VERIFY_TOKEN" ]; then
                printf '\nMETA_WEBHOOK_VERIFY_TOKEN=%s\n' "$META_WEBHOOK_VERIFY_TOKEN" >> .env
                echo "==> META_WEBHOOK_VERIFY_TOKEN injected from repository secret."
              else
                echo "!! WARNING: META_WEBHOOK_VERIFY_TOKEN is not defined in PRODUCTION_ENV_FILE or repository secrets. Meta webhook verification will fail."
              fi
            fi

            # 5. Synchronize codebase configuration (nginx.conf, docker-compose.yml)
            sudo chown -R $(whoami):$(whoami) /home/ubuntu/app
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote rm origin || true
            git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 6. Login to GitHub Container Registry (GHCR)
            echo $GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 7. Export environment for Docker Compose
            export GITHUB_REPOSITORY_LOWER=$REPO_LOWER

            # 8. Pull latest multi-stage images
            echo "==> Pulling latest production container images..."
            docker compose pull
            docker compose -f docker-compose.livekit.yml pull || true

            # 9. Stop host-level services / processes binding to port 80 or 443
            sudo systemctl stop nginx apache2 2>/dev/null || true
            sudo systemctl disable nginx apache2 2>/dev/null || true
            sudo fuser -k 80/tcp 443/tcp 2>/dev/null || true

            # 10. Clean up unused legacy PM2 processes to free RAM
            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true
            npx pm2 kill 2>/dev/null || true

            # 11. Graceful Rolling Restart (zero-downtime)
            docker compose up -d --force-recreate --remove-orphans
            docker compose -f docker-compose.livekit.yml up -d

            # 12. Health verification
            sleep 5
            echo "==> Verifying container status..."
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # 13. Clean up dangling images to preserve disk space
            docker image prune -af --filter "until=24h" 2>/dev/null || true

      - name: Sync Cloudflare DNS Records to EC2 Host
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          TARGET_IP: ${{ secrets.EC2_HOST }}
        run: |
          node << 'EOF'
          const https = require('https');

          const token = process.env.CF_TOKEN;
          const key = process.env.CF_KEY;
          const email = process.env.CF_EMAIL;
          const targetIp = process.env.TARGET_IP;

          if (!targetIp) {
            console.error('No TARGET_IP (EC2_HOST) configured.');
            process.exit(1);
          }

          console.log(`==> Synchronizing Cloudflare DNS to EC2 Host: ${targetIp}`);

          function cfRequest(path, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const headers = { 'Content-Type': 'application/json' };
              if (key && email) {
                headers['X-Auth-Key'] = key;
                headers['X-Auth-Email'] = email;
              } else if (token) {
                headers['Authorization'] = `Bearer ${token}`;
              } else {
                return reject(new Error('No Cloudflare credentials found in secrets'));
              }

              const req = https.request(`https://api.cloudflare.com/client/v4${path}`, { method, headers }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const parsed = JSON.parse(data);
                    if (!parsed.success) {
                      return reject(new Error(`CF API Error: ${JSON.stringify(parsed.errors)}`));
                    }
                    resolve(parsed.result);
                  } catch (e) {
                    reject(new Error(`JSON Parse Error: ${data}`));
                  }
                });
              });

              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const zones = await cfRequest('/zones?name=180workspace.com');
            if (!zones || zones.length === 0) {
              throw new Error('Zone 180workspace.com not found');
            }
            const zoneId = zones[0].id;
            const records = await cfRequest(`/zones/${zoneId}/dns_records?per_page=100`);

            const subdomainsToUpdate = [
              'api.180workspace.com',
              'app.180workspace.com',
              'admin.180workspace.com',
              'livekit.180workspace.com',
              'cname.180workspace.com',
              '*.180workspace.com'
            ];

            for (const sub of subdomainsToUpdate) {
              const existing = records.find(r => r.name === sub && (r.type === 'A' || r.type === 'CNAME'));
              if (existing) {
                if (existing.content === targetIp) {
                  console.log(`✓ Record ${sub} already points to ${targetIp}`);
                } else {
                  console.log(`==> Updating ${sub} from ${existing.content} to ${targetIp}...`);
                  await cfRequest(`/zones/${zoneId}/dns_records/${existing.id}`, 'PATCH', {
                    type: 'A',
                    name: sub,
                    content: targetIp,
                    proxied: true
                  });
                  console.log(`✓ Updated ${sub} -> ${targetIp}`);
                }
              } else {
                console.log(`==> Creating A record for ${sub} -> ${targetIp}...`);
                await cfRequest(`/zones/${zoneId}/dns_records`, 'POST', {
                  type: 'A',
                  name: sub,
                  content: targetIp,
                  ttl: 1,
                  proxied: true
                });
                console.log(`✓ Created ${sub} -> ${targetIp}`);
              }
            }

            console.log('==> Cloudflare DNS is in sync with EC2.');
          }

          main().catch(err => {
            console.error('DNS Sync Warning/Error:', err.message);
            // Non-blocking so DNS API hiccups do not fail an already successful container deployment
            process.exit(0);
          });
          EOF


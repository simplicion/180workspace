name: Master CI/CD Pipeline

on:
  push:
    branches: [ "Production", "main", "Testing-updates" ]

jobs:
  # ==========================================
  # Phase 1: Preparation
  # ==========================================
  prepare:
    name: Prepare & Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup pnpm cache
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ==========================================
  # Phase 2: Build Backend
  # ==========================================
  build-backend:
    name: Build Backend Services
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Database & Packages
        run: pnpm turbo run build --filter=backend --filter=worker
        
      - name: Bundle compiled files
        run: |
          find packages apps/backend apps/worker -type d -name "dist" -not -path "*/node_modules/*" 2>/dev/null | tar -czf dists.tar.gz -T - || echo "No dist directories found"
          
      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-backend
          path: dists.tar.gz
          retention-days: 1

  # ==========================================
  # Phase 3: Deploy Backend to AWS EC2
  # ==========================================
  deploy-backend:
    name: Deploy to AWS EC2
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled files
        uses: actions/download-artifact@v4
        with:
          name: compiled-backend

      - name: Copy compiled files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dists.tar.gz"
          target: "/tmp"

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/app
            if [ ! -d ".git" ]; then
              git init
            fi
            git remote rm origin || true
            git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Extract compiled files from GitHub Actions
            tar -xzf /tmp/dists.tar.gz -C /home/ubuntu/app || echo "No dists to extract"
            
            # Add swap space to prevent Out Of Memory (OOM) during install
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            # Stop all PM2 processes to free up memory/CPU
            pm2 stop all || true
            
            # Install dependencies (runs prisma generate via postinstall)
            pnpm install --prod=false --frozen-lockfile
            
            # Restart processes
            pm2 restart all --update-env || pm2 start ecosystem.config.js
            pm2 save



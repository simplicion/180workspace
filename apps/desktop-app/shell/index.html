<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>180 Workspace</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#475569; --border:#e2e8f0; --accent:#4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --card:#0f172a; --text:#f1f5f9; --muted:#94a3b8; --border:#1e293b; --accent:#6366f1; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width:100%; max-width:460px; padding:32px; text-align:center; }
    .spinner { width:36px; height:36px; margin:0 auto 20px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { font-size:18px; margin:0 0 8px; }
    p { margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--muted); }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
    button { font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:12px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main>
    <div id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Starting 180 Workspace…</h1>
      <p>Connecting to your workspace.</p>
    </div>

    <div id="offline" class="hidden">
      <h1>Can't reach 180 Workspace</h1>
      <p id="offline-msg">You appear to be offline. If you have opened the app while online before, your saved workspace can still open.</p>
      <div class="actions">
        <button class="primary" id="retry" type="button">Try again</button>
        <button id="open-offline" type="button">Open offline workspace</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      // Injected by the native shell before this script runs (see src-tauri/src/lib.rs). Falls back to production.
      var origin = window.__180_APP_ORIGIN__ || 'https://app.180workspace.com';
      var route = window.__180_INITIAL_ROUTE__ || '/';
      var target = origin + route;
      var loading = document.getElementById('loading');
      var offline = document.getElementById('offline');

      function go() { window.location.replace(target); }

      function reachable() {
        // Any response at all (even an error page) means the server can be reached; only a thrown fetch means offline.
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 5000);
        return fetch(origin + '/manifest.json', { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
          .then(function () { clearTimeout(timer); return true; })
          .catch(function () { clearTimeout(timer); return false; });
      }

      function start() {
        loading.classList.remove('hidden');
        offline.classList.add('hidden');
        reachable().then(function (ok) {
          if (ok) return go();
          loading.classList.add('hidden');
          offline.classList.remove('hidden');
        });
      }

      document.getElementById('retry').addEventListener('click', start);
      // Navigating while offline works only if the web app's service worker has already cached its shell during an
      // earlier online launch; on a first-ever launch this shows the browser's own error page, hence the wording above.
      document.getElementById('open-offline').addEventListener('click', go);
      window.addEventListener('online', start);
      start();
    })();
  </script>
</body>
</html>

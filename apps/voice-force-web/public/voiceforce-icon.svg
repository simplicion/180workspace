<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vf-bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <linearGradient id="vf-ring-grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="vf-wave-grad" x1="120" y1="200" x2="392" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="vf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#vf-bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#vf-ring-grad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#vf-ring-grad)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="12 12" />

  <!-- Central Sonic Waveform -->
  <g filter="url(#vf-glow)">
    <!-- Bar 1 -->
    <rect x="144" y="224" width="16" height="64" rx="8" fill="url(#vf-wave-grad)" />
    <!-- Bar 2 -->
    <rect x="176" y="192" width="16" height="128" rx="8" fill="url(#vf-wave-grad)" />
    <!-- Bar 3 -->
    <rect x="208" y="152" width="16" height="208" rx="8" fill="url(#vf-wave-grad)" />
    <!-- Bar 4 (Center Telephone Core) -->
    <rect x="240" y="120" width="16" height="272" rx="8" fill="#ffffff" />
    <!-- Bar 5 -->
    <rect x="272" y="152" width="16" height="208" rx="8" fill="url(#vf-wave-grad)" />
    <!-- Bar 6 -->
    <rect x="304" y="192" width="16" height="128" rx="8" fill="url(#vf-wave-grad)" />
    <!-- Bar 7 -->
    <rect x="336" y="224" width="16" height="64" rx="8" fill="url(#vf-wave-grad)" />
  </g>

  <!-- AI Accent Nodes -->
  <circle cx="248" cy="80" r="10" fill="#22d3ee" filter="url(#vf-glow)" />
  <circle cx="248" cy="432" r="10" fill="#6366f1" filter="url(#vf-glow)" />
</svg>

version: '3.8'

services:
  # 1. 180workspace Frontend
  frontend:
    image: ghcr.io/${GITHUB_ACTOR:-yourusername}/180workspace-platform-frontend:latest
    container_name: frontend
    ports:
      - "3002:3002"
    restart: unless-stopped
    # env_file:
    #   - ./apps/frontend/.env

  # 2. 180workspace Admin Web App
  admin-web:
    image: ghcr.io/${GITHUB_ACTOR:-yourusername}/180workspace-platform-admin-web:latest
    container_name: admin-web
    ports:
      - "3003:3003"
    restart: unless-stopped
    # env_file:
    #   - ./apps/admin-web/.env

